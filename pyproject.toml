[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pedalatlas"
version = "0.1.0"
description = "Evidence-backed bicycle touring atlas from Alaska toward Vancouver."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.6",
  "pandas>=2.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "agents*",
  "backend*",
  "evaluation*",
  "ingestion*",
  "integrations*",
  "orchestration*",
  "routing*",
  "scripts*",
  "verification*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
